[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoflib-cloud"
version = "0.1.0"
description = "One contract for cloud file storage: generic S3-compatible adapter with list, search, upload, download, copy, move and safe delete."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["zoflib_cloud"]
