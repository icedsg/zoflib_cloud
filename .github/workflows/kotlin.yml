name: Kotlin

on:
  push:
    paths: ["packages/kotlin/**", "spec/**", "conformance/**", ".github/workflows/kotlin.yml"]
  pull_request:
    paths: ["packages/kotlin/**", "spec/**", "conformance/**", ".github/workflows/kotlin.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: JVM tests and distribution
        working-directory: packages/kotlin
        run: gradle test installDist
      - name: Shared conformance
        run: python conformance/run.py packages/kotlin/build/install/zoflib-cloud-kotlin/bin/zoflib-cloud-kotlin
