name: C#
on:
  push:
    paths: ['packages/csharp/**', 'spec/**', 'conformance/**', '.github/workflows/csharp.yml']
  pull_request:
    paths: ['packages/csharp/**', 'spec/**', 'conformance/**', '.github/workflows/csharp.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Start disposable S3 endpoint
        run: docker run -d --name zoflib-s3 -p 9090:9090 adobe/s3mock:latest
      - name: Test package and generic S3 adapter
        env:
          ZOFLIB_S3_ENDPOINT: http://127.0.0.1:9090
          ZOFLIB_S3_ACCESS: zoflibtest
          ZOFLIB_S3_SECRET: zoflibtestsecret
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:9090/ && break || sleep 1; done
          dotnet test packages/csharp/Zoflib.Cloud.Tests/Zoflib.Cloud.Tests.csproj --configuration Release
      - run: dotnet build packages/csharp/Zoflib.Cloud.Driver/Zoflib.Cloud.Driver.csproj --configuration Release
      - run: python conformance/run.py dotnet packages/csharp/Zoflib.Cloud.Driver/bin/Release/net10.0/Zoflib.Cloud.Driver.dll
