name: Python
on:
  push:
    paths: ['packages/python/**', 'spec/**', 'conformance/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['packages/python/**', 'spec/**', 'conformance/**', '.github/workflows/python.yml']
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy: { matrix: { python: ['3.9', '3.13'] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m unittest discover -s packages/python/tests
      - name: Shared conformance, memory backend (also checks the contract version and spec files)
        run: PYTHONPATH=packages/python python conformance/run.py python -m zoflib_cloud.driver
      - name: Shared conformance through the S3 adapter (disposable fake S3 server)
        run: |
          python conformance/fake_s3.py 9291 &
          sleep 2
          PYTHONPATH=packages/python ZOFLIB_S3_ENDPOINT=http://127.0.0.1:9291 ZOFLIB_S3_ACCESS=zoflibtest ZOFLIB_S3_SECRET=zoflibtestsecret \
            python conformance/run.py python -m zoflib_cloud.driver
